spring:
  application:
    name: attendease-backend
  
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**,templates/**
    livereload:
      enabled: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:carlobaclao789@gmail.com}
    password: ${MAIL_PASSWORD:ijlxhoyruplmppql}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/attendease_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Manila

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8138}

# Application-specific configuration
app:
  jwt:
    secret: ${JWT_SECRET_KEY:${JWT_SECRET:attendease-super-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256}}
    access-token-expiration-ms: 86400000       # 24 hours (Stable Session)
    refresh-token-expiration-ms: 604800000   # 7 days

  encryption:
    aes-secret-key: ${AES_SECRET_KEY:${AES_SECRET:AttendEaseAES256SecretKey@Dev32!}}

  cors:
    allowed-origins: https://eattendease.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5220,http://localhost:8138,http://192.168.1.2:5173,http://192.168.137.1:5173,http://192.168.137.7:5173,http://192.168.1.122:5173,http://192.168.100.41:5173,http://192.168.100.41:8080,http://192.168.100.45:5173,https://*.ngrok-free.dev,http://192.168.100.45:5173,http://192.168.0.105:5173,http://192.168.0.101:8138,http://192.168.0.101:5220

  upload:
    dir: ./uploads
    max-size: 10485760
    allowed-types: pdf,ppt,pptx,doc,docx,xls,xlsx,jpg,jpeg,png,gif,mp4,zip,rar,txt,csv
